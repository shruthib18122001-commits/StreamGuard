[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamguard"
version = "0.1.0"
description = "Real-time multi-stream GPU inference with SLA-driven adaptive degradation"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "psutil>=5.9",
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
viz = [
    "matplotlib>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["streamguard"]
